apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-storage
  namespace: devops-lab

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-storage

  template:
    metadata:
      labels:
        app: nginx-storage

    spec:
      containers:
        - name: nginx
          image: nginx:stable

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-storage-volume
              mountPath: /usr/share/nginx/html

      volumes:
        - name: nginx-storage-volume
          persistentVolumeClaim:
            claimName: nginx-pvc
